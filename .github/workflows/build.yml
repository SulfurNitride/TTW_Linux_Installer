name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2

    - name: Build release
      run: cargo build --release

    - name: Bundle release
      run: |
        mkdir -p release
        cp target/release/mpi_installer release/
        cp target/release/mpi_installer_gui release/
        chmod +x release/mpi_installer
        chmod +x release/mpi_installer_gui

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mpi-installer-linux-x86_64
        path: release/

  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2

    - name: Build release
      run: cargo build --release

    - name: Bundle release
      run: |
        New-Item -ItemType Directory -Force -Path release
        Copy-Item target\release\mpi_installer.exe release\
        Copy-Item target\release\mpi_installer_gui.exe release\
      shell: pwsh

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mpi-installer-windows-x86_64
        path: release/

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download Linux artifacts
      uses: actions/download-artifact@v4
      with:
        name: mpi-installer-linux-x86_64
        path: release-linux/

    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: mpi-installer-windows-x86_64
        path: release-windows/

    - name: Create tarballs
      run: |
        cd release-linux
        tar -czvf ../mpi-installer-linux-x86_64.tar.gz .
        cd ../release-windows
        zip -r ../mpi-installer-windows-x86_64.zip .

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          mpi-installer-linux-x86_64.tar.gz
          mpi-installer-windows-x86_64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
