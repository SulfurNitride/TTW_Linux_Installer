name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xdelta3 libasound2-dev

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release
      run: cargo build --release

    - name: Run tests
      run: cargo test --release

    - name: Bundle release
      run: |
        mkdir -p release/tools
        cp target/release/mpi_installer release/
        cp target/release/mpi_installer_gui release/
        cp /usr/bin/xdelta3 release/tools/
        chmod +x release/tools/xdelta3
        chmod +x release/mpi_installer
        chmod +x release/mpi_installer_gui

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ttw-installer-linux-x86_64
        path: release/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: ttw-installer-linux-x86_64
        path: release/

    - name: Create tarball
      run: |
        cd release
        tar -czvf ../ttw-installer-linux-x86_64.tar.gz .

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ttw-installer-linux-x86_64.tar.gz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
