[package]
name = "ttw_installer"
version = "0.1.6"
edition = "2021"
description = "Tale of Two Wastelands Linux Installer"
authors = ["Sulfur Nitride"]

[dependencies]
# BSA handling
ba2 = "3.0.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Compression (zlib-rs is pure Rust and fastest for BSA decompression)
lz4_flex = "0.12"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

# Audio decoding (pure Rust)
symphonia = { version = "0.5", features = ["ogg", "wav", "pcm", "vorbis", "mp3"] }

# Resampling (pure Rust)
rubato = "0.16"

# WAV writing (pure Rust)
hound = "3.5"

# OGG/Vorbis encoding (C bindings, bundled)
vorbis_rs = "0.5"

# MP3 encoding (LAME C bindings)
mp3lame-encoder = "0.2"

# Serialization (for MPI parsing)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Parallel processing
rayon = "1.10"
crossbeam-channel = "0.5"  # For bounded producer-consumer pattern

# System info (for memory detection)
sysinfo = "0.35"

# File utilities
walkdir = "2.5"
tempfile = "3.10"
memmap2 = "0.9"  # Memory-mapped files (uses virtual memory, not RAM)

# Hashing
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"

# Path handling
dirs = "5.0"

# Progress bars
indicatif = "0.17"

# HTTP for downloading xdelta3
ureq = "2.9"

# Archive handling
tar = "0.4"
zip = "0.6"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.4"
chrono = "0.4"

# SQLite for BSA caching (reduces RAM usage)
rusqlite = { version = "0.31", features = ["bundled"] }

# GUI
eframe = "0.33.3"
egui = "0.33.3"
rfd = "0.17"  # File dialogs

# Platform-specific (must be at end to not break other deps)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "mpi_installer"
path = "src/mpi_installer/cli.rs"

[[bin]]
name = "mpi_installer_gui"
path = "src/mpi_installer/gui.rs"

